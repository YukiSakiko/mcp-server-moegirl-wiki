[project]
name = "mcp-server-moegirl-wiki"
version = "0.2.0"
description = "MCP server for Moegirl Wiki (萌娘百科) — search entries and fetch page summaries via the MediaWiki API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "XXXxx7258"}]
keywords = ["mcp", "model-context-protocol", "moegirl", "wiki", "mediawiki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
mcp-server-moegirl-wiki = "mcp_server_moegirl_wiki.server:main"

[project.urls]
Homepage = "https://github.com/XXXxx7258/mcp-server-moegirl-wiki"
Repository = "https://github.com/XXXxx7258/mcp-server-moegirl-wiki"
Issues = "https://github.com/XXXxx7258/mcp-server-moegirl-wiki/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_moegirl_wiki"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "network: tests that hit the real Moegirl Wiki API (skip with -m 'not network')",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
