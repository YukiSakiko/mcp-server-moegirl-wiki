name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # 手动补发/重跑用。配合下面的 skip-existing，已存在的版本不会把流水线搞红。
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build distributions and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 版本已在 PyPI 上时跳过而不是报错：重发 tag、手动补跑都安全。
          skip-existing: true
